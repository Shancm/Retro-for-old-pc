name: Build Retro OS v1.1 lightweight 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Environment and Fix Syslinux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git dos2unix isolinux syslinux syslinux-common syslinux-utils xorriso mtools dosfstools squashfs-tools live-build

          # Syslinux binary സ്ക്രിപ്റ്റിൽ നിന്നുള്ള Ubuntu theme പാക്കേജ് നിർബന്ധിത ഇൻസ്റ്റാളേഷൻ നീക്കം ചെയ്യുന്നു
          for file in /usr/lib/live/build/binary_syslinux /usr/share/live/build/binary_syslinux; do
            if [ -f "$file" ]; then
              sudo sed -i 's/lb chroot_install-packages syslinux/true # bypass/g' "$file"
              sudo sed -i 's/syslinux-themes-[^ "]*//g' "$file"
              sudo sed -i 's/gfxboot-theme-[^ "]*//g' "$file"
            fi
          done

          # Clone repository
          cd /home/runner
          rm -rf my-retro-build
          git clone --depth 1 https://github.com/Shancm/Retro-for-old-pc.git my-retro-build
          cd my-retro-build

          # Fix line endings and permissions
          find . -type f -exec dos2unix -q {} + || true
          chmod -R +x .

          # Start build process
          BUILD_SCRIPT=$(ls | grep -E "build.*iso.*\.sh" | head -n 1)
          echo "Starting Build with: $BUILD_SCRIPT"
          sudo env "PATH=$PATH" bash "./$BUILD_SCRIPT"

          # Collect build output
          mkdir -p "$GITHUB_WORKSPACE/output"
          find . -name "*.iso" -exec mv {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-v1.1-ISO-lightweight
          path: output/*.iso
