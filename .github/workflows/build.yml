name: Build Retro OS v1.1 lightweight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # Build the code in THIS repo/commit (the old workflow cloned upstream main instead).
      - name: Checkout
        uses: actions/checkout@v4

      # Debian + firmware + desktop needs far more than the ~14 GB a fresh runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Normalize line endings and permissions (scripts only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix
          dos2unix -q ./*.sh ./config.env ./retro
          chmod +x ./*.sh ./retro

      # Run inside Debian trixie so live-build/debootstrap/syslinux match the target
      # distro instead of whatever the Ubuntu runner ships.
      - name: Build ISO (debian:trixie container)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            debian:trixie \
            bash -c 'apt-get update -qq && apt-get install -y -qq ca-certificates && bash ./build_final_iso.sh'

      - name: Collect ISO
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          mkdir -p output
          mv ./*.iso output/
          ls -lh output/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Retro-OS-v1.1-ISO-lightweight
          path: output/*.iso
          if-no-files-found: error
          compression-level: 0
